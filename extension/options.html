<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Falcon DM</title>
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body class="options">
    <header class="options-head">
      <img src="icon48.png" alt="" class="logo" />
      <div>
        <h1 id="title">Falcon DM</h1>
        <p class="lead" id="desc"></p>
      </div>
    </header>

    <div id="status" class="status-card" role="status" aria-live="polite"></div>

    <section class="setup-card" aria-labelledby="id-label" aria-describedby="id-hint">
      <div class="section-title" id="id-label"></div>
      <div class="mono-row">
        <code id="extension-id" class="mono"></code>
        <button id="copy-id" class="secondary sm" type="button"></button>
      </div>
      <p class="hint" id="id-hint"></p>
    </section>

    <section class="setup-card">
      <label class="field-label" for="api-token" id="token-label"></label>
      <input
        id="api-token"
        class="field-input mono"
        type="password"
        autocomplete="off"
        aria-describedby="token-hint"
      />
      <p class="hint" id="token-hint"></p>
      <div class="actions">
        <button id="save-token" class="primary" type="button"></button>
      </div>
    </section>

    <div class="actions" role="group" aria-describedby="hint">
      <button id="pair" class="secondary" type="button"></button>
      <button id="test" class="secondary" type="button"></button>
    </div>

    <label class="check-row options-check" for="fail-closed">
      <input id="fail-closed" type="checkbox" aria-describedby="fail-closed-hint" />
      <span id="fail-closed-label"></span>
    </label>
    <p class="hint" id="fail-closed-hint"></p>
    <label class="check-row options-check" for="clipboard-monitor">
      <input id="clipboard-monitor" type="checkbox" aria-describedby="clipboard-monitor-hint" />
      <span id="clipboard-monitor-label"></span>
    </label>
    <p class="hint" id="clipboard-monitor-hint"></p>
    <p class="hint" id="hint"></p>
    <script src="options.js"></script>
  </body>
</html>
