<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Falcon DM</title>
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body class="options">
    <header class="opt-head">
      <img src="icon128.png" alt="" />
      <div>
        <h1 id="title">Falcon DM</h1>
        <p id="desc"></p>
      </div>
    </header>

    <section class="group" aria-labelledby="conn-title">
      <h2 class="section-title" id="conn-title"></h2>
      <div class="group-box">
        <div class="group-row">
          <span class="dot" id="dot" data-state="checking"></span>
          <div class="grow">
            <div id="conn-state">…</div>
            <div class="hint" id="conn-detail"></div>
          </div>
          <button id="pair" class="btn" type="button"></button>
        </div>
        <div class="group-row">
          <div class="grow">
            <div id="id-label"></div>
            <div class="mono hint" id="extension-id"></div>
          </div>
          <button id="copy-id" class="btn small" type="button"></button>
        </div>
      </div>
    </section>

    <section class="group" aria-labelledby="capture-title">
      <h2 class="section-title" id="capture-title"></h2>
      <div class="group-box">
        <label class="group-row switch-row" for="capture">
          <span class="grow">
            <span id="capture-label"></span>
            <span class="hint" id="capture-hint"></span>
          </span>
          <input id="capture" class="switch" type="checkbox" role="switch" />
        </label>
        <label class="group-row switch-row" for="fallback">
          <span class="grow">
            <span id="fallback-label"></span>
            <span class="hint" id="fallback-hint"></span>
          </span>
          <input id="fallback" class="switch" type="checkbox" role="switch" />
        </label>
        <label class="group-row switch-row" for="notify-success">
          <span class="grow">
            <span id="notify-success-label"></span>
            <span class="hint" id="notify-success-hint"></span>
          </span>
          <input id="notify-success" class="switch" type="checkbox" role="switch" />
        </label>
        <div class="group-row rule-row">
          <div class="grow">
            <label id="capture-types-label" for="capture-types"></label>
            <div class="hint" id="capture-types-hint"></div>
            <textarea id="capture-types" class="rule-text" rows="4" maxlength="8192" spellcheck="false" aria-describedby="capture-types-hint"></textarea>
          </div>
        </div>
        <div class="group-row rule-row">
          <div class="grow">
            <label id="blocked-sites-label" for="blocked-sites"></label>
            <div class="hint" id="blocked-sites-hint"></div>
            <textarea id="blocked-sites" class="rule-text" rows="4" maxlength="8192" spellcheck="false" aria-describedby="blocked-sites-hint"></textarea>
          </div>
        </div>
      </div>
    </section>

    <p class="hint" id="notice" role="status" aria-live="polite"></p>
    <script src="media-utils.js"></script>
    <script src="shared.js"></script>
    <script src="options.js"></script>
  </body>
</html>
