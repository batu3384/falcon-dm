<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Falcon DM</title>
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body class="options">
    <h1 id="title">Falcon DM</h1>
    <p class="lead" id="desc"></p>
    <div id="status" class="status-card" role="status" aria-live="polite"></div>
    <div class="actions">
      <button id="pair" class="primary" type="button"></button>
      <button id="test" class="secondary" type="button"></button>
    </div>
    <div class="check-row options-check">
      <input id="fail-closed" type="checkbox" />
      <label for="fail-closed" id="fail-closed-label"></label>
    </div>
    <p class="hint" id="fail-closed-hint"></p>
    <p class="hint" id="hint"></p>
    <script src="options.js"></script>
  </body>
</html>
