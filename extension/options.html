<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Falcon DM</title>
    <style>
      :root {
        --color-primary: #2563EB;
        --color-accent: #D97706;
        --accent: var(--color-accent);
        --bg: #F8FAFC;
        --text: #0F172A;
        --muted: #64748b;
        --border: #E4ECFC;
        --success: #16a34a;
        --danger: #dc2626;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
        padding: 20px;
        min-width: 340px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      h1 { font-size: 18px; margin: 0 0 6px; }
      p { font-size: 13px; color: var(--muted); margin: 0 0 16px; line-height: 1.45; }
      .status-card {
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #fff;
        margin-bottom: 14px;
        font-size: 13px;
      }
      .status-card.ok { border-color: #86efac; background: #f0fdf4; color: var(--success); }
      .status-card.err { border-color: #fecaca; background: #fef2f2; color: var(--danger); }
      .actions { display: flex; gap: 8px; }
      button {
        padding: 9px 14px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        background: var(--accent);
        color: #fff;
      }
      button.secondary {
        background: #fff;
        color: var(--text);
        border: 1px solid var(--border);
      }
      .hint { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <h1 id="title">Falcon DM</h1>
    <p id="desc"></p>
    <div id="status" class="status-card"></div>
    <div class="actions">
      <button id="pair" type="button"></button>
      <button id="test" class="secondary" type="button"></button>
    </div>
    <p class="hint" id="hint"></p>
    <script src="options.js"></script>
  </body>
</html>
