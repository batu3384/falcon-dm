<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Falcon DM</title>
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body class="popup">
    <header class="pop-head">
      <img src="icon48.png" alt="" />
      <div class="grow">
        <div class="name" id="app-name">Falcon DM</div>
        <div class="state" aria-live="polite">
          <span class="dot" id="dot" data-state="checking"></span>
          <span id="state-text">…</span>
        </div>
      </div>
      <button id="open-app" class="icon-btn" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      </button>
    </header>

    <main class="pop-body">
      <section id="card-offline" class="card" hidden>
        <h2 id="offline-title"></h2>
        <p id="offline-text"></p>
        <button id="start-app" class="btn primary" type="button"></button>
      </section>

      <section id="card-pending" class="card" hidden aria-live="polite">
        <h2 id="pending-title"></h2>
        <div class="code" id="pair-code" aria-describedby="pending-text">— — —</div>
        <p id="pending-text"></p>
      </section>

      <section id="card-blocked" class="card bad" hidden role="alert">
        <h2 id="blocked-title"></h2>
        <p id="blocked-text"></p>
        <button id="new-code" class="btn" type="button"></button>
      </section>

      <section>
        <button id="grab" class="btn primary block" type="button"></button>
        <p id="page-url" class="page-url" title=""></p>
      </section>

      <p id="notice" class="notice" hidden role="alert" tabindex="-1"></p>

      <section id="activity" hidden>
        <h2 class="section-title" id="activity-title"></h2>
        <ul id="downloads" class="downloads"></ul>
      </section>

      <label class="switch-row" for="capture">
        <span class="grow">
          <span class="title" id="capture-label"></span>
          <span class="hint" id="capture-hint"></span>
        </span>
        <input id="capture" class="switch" type="checkbox" role="switch" />
      </label>
    </main>

    <footer class="pop-foot">
      <button id="grab-links" class="link" type="button"></button>
      <button id="settings" class="link" type="button"></button>
    </footer>

    <script src="media-utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
