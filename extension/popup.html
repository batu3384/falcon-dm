<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Falcon DM</title>
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body class="popup">
    <header class="top">
      <div class="brand">
        <img src="icon48.png" alt="" class="logo" />
        <strong>__MSG_appName__</strong>
      </div>
      <span id="status" class="pill" data-state="offline" aria-live="polite">…</span>
    </header>

    <button id="grab" class="primary" type="button">__MSG_popupDownloadPage__</button>

    <div class="url-row">
      <span id="page-url" class="url" title=""></span>
      <button id="dl-url" class="secondary sm" type="button">__MSG_popupDownloadUrl__</button>
    </div>

    <div class="section">
      <div class="section-title">__MSG_popupQueueTitle__</div>
      <ul id="queue" class="queue"></ul>
    </div>

    <div class="actions">
      <button id="reconnect" class="secondary" type="button">__MSG_popupReconnect__</button>
      <button id="pause" class="secondary" type="button">__MSG_popupPause__</button>
    </div>

    <div class="check-row popup-check">
      <input id="fail-closed" type="checkbox" />
      <label for="fail-closed">__MSG_popupFailClosed__</label>
    </div>
    <p class="hint popup-hint" id="fail-closed-hint">__MSG_popupFailClosedHint__</p>

    <footer>
      <a id="settings" href="#">__MSG_popupSettings__</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
