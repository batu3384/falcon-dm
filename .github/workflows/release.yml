# ponytail: release pipeline — triggered by a `v*` tag. Provisions both macOS
# architectures' sidecar binaries, builds a signed + notarized .dmg, and uploads
# it to the GitHub Release. Falls back to an unsigned build if Apple signing
# secrets are absent (so forks/dev can still cut builds).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    env:
      APPLE_SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-13
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # ponytail: provision aria2c + ffmpeg sidecars for THIS architecture. aria2
      # has no official macOS binary, so we install it via Homebrew (available on
      # GitHub macOS runners) and copy it in. ffmpeg x86_64 comes from evermeet.
      - name: Provision sidecars (${{ matrix.arch }})
        run: ./scripts/provision-sidecars.sh
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_MODE: "1"
          ARIA2_SHA256: ${{ vars.ARIA2_SHA256 }}
          FFMPEG_URL: ${{ vars.FFMPEG_URL }}
          FFMPEG_SHA256: ${{ vars.FFMPEG_SHA256 }}

      - run: npm ci

      - name: Build native messaging host
        working-directory: src-tauri
        run: cargo build --bin falcon-dm-native-host --target ${{ matrix.target }} --release

      - name: Bundle native messaging host
        run: |
          cp "src-tauri/target/${{ matrix.target }}/release/falcon-dm-native-host" \
            "src-tauri/binaries/falcon-dm-native-host-${{ matrix.target }}"
          chmod +x "src-tauri/binaries/falcon-dm-native-host-${{ matrix.target }}"
          host_info="$(file "src-tauri/binaries/falcon-dm-native-host-${{ matrix.target }}")"
          [[ "$host_info" == *"Mach-O"* ]]
          if [[ "${{ matrix.arch }}" == "aarch64" ]]; then
            [[ "$host_info" == *"arm64"* ]]
          else
            [[ "$host_info" == *"x86_64"* ]]
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("src-tauri/tauri.conf.json")
          config = json.loads(path.read_text())
          bins = config["bundle"]["externalBin"]
          if "binaries/falcon-dm-native-host" not in bins:
              bins.append("binaries/falcon-dm-native-host")
          path.write_text(json.dumps(config, indent=2) + "\n")
          PY

      - name: Validate Apple signing configuration
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          values=(
            "$APPLE_CERTIFICATE"
            "$APPLE_CERTIFICATE_PASSWORD"
            "$APPLE_SIGNING_IDENTITY"
            "$APPLE_ID"
            "$APPLE_PASSWORD"
            "$APPLE_TEAM_ID"
          )
          present=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && present=$((present + 1))
          done
          if [[ "$present" != "0" && "$present" != "${#values[@]}" ]]; then
            echo "Apple signing configuration is incomplete; refusing unsigned fallback." >&2
            exit 1
          fi

      - name: Import Apple certificate
        if: ${{ env.APPLE_SIGNING_CONFIGURED == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/falcon-dm-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/falcon-dm-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"

      # ponytail: Tauri notarization needs the signing identity + Apple ID creds.
      - name: Build + sign + notarize (Tauri)
        if: ${{ env.APPLE_SIGNING_CONFIGURED == 'true' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Falcon DM ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Build (unsigned fallback)
        if: ${{ env.APPLE_SIGNING_CONFIGURED == 'false' }}
        run: npx tauri build --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload unsigned fallback artifacts
        if: ${{ env.APPLE_SIGNING_CONFIGURED == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: falcon-dm-unsigned-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle
          if-no-files-found: error

      - name: Compute checksum
        run: |
          set -euo pipefail
          test -x "src-tauri/binaries/aria2c-${{ matrix.target }}"
          test -x "src-tauri/binaries/ffmpeg-${{ matrix.target }}"
          test -x "src-tauri/binaries/falcon-dm-native-host-${{ matrix.target }}"
          test -x "src-tauri/target/${{ matrix.target }}/release/falcon-dm-native-host"
          : > "$GITHUB_WORKSPACE/checksums-${{ matrix.arch }}.txt"
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          dmg_count="$(find "$bundle" -type f -name "*.dmg" | wc -l | tr -d ' ')"
          [[ "$dmg_count" -gt 0 ]]
          find "$bundle" -type f -name "*.dmg" -exec shasum -a 256 {} \; \
            >> "$GITHUB_WORKSPACE/checksums-${{ matrix.arch }}.txt"
          while IFS= read -r app; do
            ditto -c -k --sequesterRsrc --keepParent "$app" "$app.zip"
            shasum -a 256 "$app.zip" >> "$GITHUB_WORKSPACE/checksums-${{ matrix.arch }}.txt"
          done < <(find "$bundle" -type d -name "*.app" -print)
          find src-tauri/binaries -type f -name "*-${{ matrix.target }}" \
            -exec shasum -a 256 {} \; \
            >> "$GITHUB_WORKSPACE/checksums-${{ matrix.arch }}.txt"
          shasum -a 256 \
            "src-tauri/target/${{ matrix.target }}/release/falcon-dm-native-host" \
            >> "$GITHUB_WORKSPACE/checksums-${{ matrix.arch }}.txt"

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.arch }}
          path: checksums-${{ matrix.arch }}.txt
