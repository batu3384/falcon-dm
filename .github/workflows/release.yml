# ponytail: release pipeline — triggered by a `v*` tag. Builds a signed +
# notarized .dmg for both macOS architectures and uploads it to the GitHub Release.
# Apple signing secrets are required; unsigned release builds are refused.
name: Release

permissions:
  contents: write

on:
  push:
    tags: ["v*"]

jobs:
  release:
    env:
      APPLE_SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Validate release tag version
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" != "$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match tauri.conf.json version $version." >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - name: Validate Apple signing configuration
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          values=(
            "$APPLE_CERTIFICATE"
            "$APPLE_CERTIFICATE_PASSWORD"
            "$APPLE_SIGNING_IDENTITY"
            "$APPLE_ID"
            "$APPLE_PASSWORD"
            "$APPLE_TEAM_ID"
          )
          present=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && present=$((present + 1))
          done
          if [[ "$present" != "0" && "$present" != "${#values[@]}" ]]; then
            echo "Apple signing configuration is incomplete; refusing unsigned fallback." >&2
            exit 1
          fi

      - name: Import Apple certificate
        if: ${{ env.APPLE_SIGNING_CONFIGURED == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/falcon-dm-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/falcon-dm-signing.p12"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"

      # ponytail: Tauri notarization needs the signing identity + Apple ID creds.
      - name: Build + sign + notarize (Tauri)
        if: ${{ env.APPLE_SIGNING_CONFIGURED == 'true' }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Falcon DM ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} -- --locked

      - name: Refuse unsigned release
        if: ${{ env.APPLE_SIGNING_CONFIGURED != 'true' }}
        run: |
          echo "Apple signing secrets are required. Unsigned release builds are not published." >&2
          exit 1

      - name: Clean up signing keychain
        if: ${{ always() && env.APPLE_SIGNING_CONFIGURED == 'true' }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/falcon-dm-signing.keychain-db"
          certificate="$RUNNER_TEMP/falcon-dm-signing.p12"
          rm -f "$certificate"
          security default-keychain -s login.keychain-db >/dev/null 2>&1 || true
          security list-keychains -d user -s login.keychain-db >/dev/null 2>&1 || true
          if ! security delete-keychain "$keychain" >/dev/null 2>&1; then
            security lock-keychain "$keychain" >/dev/null 2>&1 || true
          fi

      - name: Compute checksum
        run: |
          set -euo pipefail
          : > "$GITHUB_WORKSPACE/checksums-${{ matrix.arch }}.txt"
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          dmg_count="$(find "$bundle" -type f -name "*.dmg" | wc -l | tr -d ' ')"
          [[ "$dmg_count" -gt 0 ]]
          find "$bundle" -type f -name "*.dmg" -exec shasum -a 256 {} \; \
            >> "$GITHUB_WORKSPACE/checksums-${{ matrix.arch }}.txt"
          while IFS= read -r app; do
            ditto -c -k --sequesterRsrc --keepParent "$app" "$app.zip"
            shasum -a 256 "$app.zip" >> "$GITHUB_WORKSPACE/checksums-${{ matrix.arch }}.txt"
          done < <(find "$bundle" -type d -name "*.app" -print)

      - name: Upload checksum artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checksums-${{ matrix.arch }}
          path: checksums-${{ matrix.arch }}.txt

  finalize:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download checksum artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: checksums-*
          path: checksums
          merge-multiple: true

      - name: Attach checksums to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(checksums/checksums-*.txt)
          if (( ${#files[@]} != 2 )); then
            echo "Expected 2 checksum files, found ${#files[@]}." >&2
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
