# ponytail: continuous integration — runs on every push/PR. Guards formatting,
# lints, tests, the build, and supply-chain audits on both macOS architectures.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS — GH runners default to Node 24 which breaks jsdom/vitest (undici).
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Type-check + build
        run: npm run build
      - name: npm audit (production deps, high+critical fail)
        run: npm audit --omit=dev --audit-level=high

  rust:
    name: Rust (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Install sidecar deps (Homebrew)
        run: brew install aria2 ffmpeg
      - name: Provision sidecars (${{ matrix.arch }})
        run: ./scripts/provision-sidecars.sh
        env:
          ARCH: ${{ matrix.arch }}
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test
      - name: Build (debug)
        working-directory: src-tauri
        run: cargo build

  cargo-deny:
    name: Supply-chain audit (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
          manifest-path: src-tauri/Cargo.toml
