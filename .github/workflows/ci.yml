# ponytail: continuous integration — runs on every push/PR. Guards formatting,
# lints, tests, the build, and supply-chain audits on macOS arm64 (Intel covered
# in release.yml matrix).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 22 LTS — GH runners default to Node 24 which breaks jsdom/vitest (undici).
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Type-check + build
        run: npm run build
      - name: Extension smoke contract
        run: node extension/smoke-test.mjs
      - name: Extension manifest JSON
        run: |
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("extension/manifest.json","utf8")); if (!m.permissions.includes("nativeMessaging")) process.exit(1); if (!m.background?.service_worker) process.exit(1);'
      - name: npm audit (production deps, high+critical fail)
        run: npm audit --omit=dev --audit-level=high

  rust:
    name: Rust (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"
      - name: Sidecar checksum helper test
        run: |
          bash scripts/provision-sidecars.test.sh
          bash -n scripts/provision-sidecars.sh
      - name: Install sidecar deps (Homebrew)
        run: brew install aria2 ffmpeg
      - name: Provision sidecars (aarch64)
        run: ./scripts/provision-sidecars.sh
        env:
          ARCH: aarch64
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test --workspace
      - name: Build (debug)
        working-directory: src-tauri
        run: cargo build --workspace

  cargo-deny:
    name: Supply-chain audit (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources
          manifest-path: src-tauri/Cargo.toml
