# ponytail: continuous integration — runs on every push/PR. Guards formatting,
# lints, tests, the build, and supply-chain audits on macOS arm64 (Intel covered
# in release.yml matrix).
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz -o gitleaks.tar.gz
          echo "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5  gitleaks.tar.gz" | shasum -a 256 -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose .

  frontend:
    name: Frontend (lint + test + build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 22 LTS — GH runners default to Node 24 which breaks jsdom/vitest (undici).
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Type-check + build
        run: npm run build
      - name: Extension smoke contract
        run: node extension/smoke-test.mjs
      - name: Extension flow contract
        run: node extension/flow-test.mjs
      - name: npm audit (production deps, high+critical fail)
        run: npm audit --omit=dev --audit-level=high

  rust:
    name: Rust (macos-15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test --workspace --locked
      - name: Build (debug)
        working-directory: src-tauri
        run: cargo build --workspace --locked

  cargo-deny:
    name: Supply-chain audit (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.1
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources
          manifest-path: src-tauri/Cargo.toml
